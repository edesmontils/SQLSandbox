name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3, simplexml
      - run: php tests/run.php

  # Même version de SQLite que l'hébergement OVH (image stable64) : les protections
  # propres aux anciennes versions (fenêtrage, printf) n'agissent qu'avec elle.
  tests-sqlite-ovh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, simplexml
      - name: Compiler SQLite 3.27.2
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL https://www.sqlite.org/2019/sqlite-autoconf-3270200.tar.gz | tar -xz
          cd sqlite-autoconf-3270200
          # Options de compilation proches de celles de Debian
          CFLAGS="-O2 -DSQLITE_ENABLE_FTS3 -DSQLITE_ENABLE_FTS3_PARENTHESIS -DSQLITE_ENABLE_FTS4 \
            -DSQLITE_ENABLE_FTS5 -DSQLITE_ENABLE_RTREE -DSQLITE_ENABLE_JSON1 \
            -DSQLITE_ENABLE_COLUMN_METADATA -DSQLITE_ENABLE_DBSTAT_VTAB \
            -DSQLITE_ENABLE_UNLOCK_NOTIFY -DSQLITE_SECURE_DELETE" \
            ./configure --prefix="$RUNNER_TEMP/sqlite-ovh" --disable-static
          make -j"$(nproc)"
          make install
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/sqlite-ovh/lib" >> "$GITHUB_ENV"
      - name: Vérifier que PHP utilise SQLite 3.27.2
        run: |
          php -r 'echo SQLite3::version()["versionString"], "\n";
                  exit(SQLite3::version()["versionString"] === "3.27.2" ? 0 : 1);'
      - run: php tests/run.php
